server.port=${PORT:8181}
server.address=${BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/catalog;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
server.error.include-message=always
internal.secret=${INTERNAL_SECRET}
